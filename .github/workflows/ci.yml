name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Build (convert, patch, validate)
        run: npm run build

      - name: Committed output matches a fresh build
        run: git diff --exit-code -- output

      # Fixtures include real responses (fixtures/_live, scrubbed), so this
      # fails when the spec stops matching what QuickBase returns.
      - name: Health check (fixtures against the spec)
        run: npx tsx tools/cli.ts health
